<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#150e2e"/>
      <stop offset="1" stop-color="#0d1528"/>
    </linearGradient>
    <linearGradient id="mk" x1="3" y1="3" x2="29" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#ede9fe"/>
      <stop offset="0.35" stop-color="#a78bfa"/>
      <stop offset="0.75" stop-color="#6366f1"/>
      <stop offset="1"    stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- 3-spoke asterisk centred at 16,16 -->
  <rect x="13.25" y="3" width="5.5" height="26" rx="2.75" fill="url(#mk)"/>
  <rect x="13.25" y="3" width="5.5" height="26" rx="2.75" fill="url(#mk)" opacity="0.72" transform="rotate(60 16 16)"/>
  <rect x="13.25" y="3" width="5.5" height="26" rx="2.75" fill="url(#mk)" opacity="0.48" transform="rotate(120 16 16)"/>
</svg>
